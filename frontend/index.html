<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyDeskmate</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; overflow: hidden; }

#input-section { display: flex; gap: 8px; padding: 12px 16px; background: #1a1a1a; border-bottom: 1px solid #333; align-items: center; }
#url-input { flex: 1; padding: 8px 12px; border: 1px solid #444; border-radius: 6px; background: #262626; color: #e0e0e0; font-size: 14px; }
#url-input::placeholder { color: #888; }
#file-input { display: none; }
#file-label { padding: 8px 12px; border: 1px solid #444; border-radius: 6px; background: #262626; cursor: pointer; font-size: 13px; white-space: nowrap; }
#load-btn { padding: 8px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
#load-btn:hover { background: #2563eb; }

#adv-panel { position: absolute; right: 0; top: 28px; z-index: 10; display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); width: 260px; }
#adv-panel input { padding: 6px 10px; border: 1px solid #444; border-radius: 6px; background: #262626; color: #e0e0e0; font-size: 12px; }
#adv-panel input::placeholder { color: #777; }

#progress-area { padding: 8px 16px; background: #1a1a1a; border-bottom: 1px solid #333; display: none; font-size: 13px; color: #888; }
#progress-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 6px; }
#progress-fill { height: 100%; background: #3b82f6; border-radius: 2px; width: 0%; transition: width 0.3s; }

#main-content { display: none; height: calc(100vh - 100px); }

#video-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; padding: 20px; }
#video-player { max-width: 100%; max-height: 100%; border-radius: 8px; }

#chapter-area { width: 300px; display: flex; flex-direction: column; background: #151515; border-left: 1px solid #333; overflow-y: auto; }
#chapter-area h3 { padding: 12px 14px 8px; font-size: 13px; color: #888; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; background: #151515; }
#chapter-list { padding: 6px 0; }
.chapter-item { padding: 9px 14px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.15s; }
.chapter-item:hover { background: #222; }
.chapter-item.active { background: #1e2a3f; border-left-color: #3b82f6; }
.chapter-title { font-size: 13px; font-weight: 500; color: #e0e0e0; }
.chapter-time { font-size: 11px; color: #888; margin-top: 2px; }
.chapter-summary { font-size: 12px; color: #aaa; margin-top: 3px; line-height: 1.4; }
#chapter-empty { padding: 14px; font-size: 12px; color: #666; }

#chat-area { width: 360px; display: flex; flex-direction: column; background: #1a1a1a; border-left: 1px solid #333; }
#chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
#chat-messages::-webkit-scrollbar { width: 6px; }
#chat-messages::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

.chat-bubble { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 90%; word-wrap: break-word; }
.chat-bubble.user { align-self: flex-end; background: #3b82f6; color: #fff; }
.chat-bubble.assistant { align-self: flex-start; background: #333; color: #e0e0e0; }
.chat-bubble.warning { align-self: flex-start; background: #4a3f00; color: #fbbf24; font-size: 12px; }
.chat-bubble.info { align-self: center; background: #1e3a5f; color: #93c5fd; font-size: 11px; }

.chat-bubble.thinking { color: #888; font-style: italic; }
.chat-bubble.thinking::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }
.chat-bubble .cite { color: #60a5fa; text-decoration: underline; cursor: pointer; padding: 0 1px; border-radius: 3px; }
.chat-bubble .cite:hover { background: #1e3a5f; }

#chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #333; }
#chat-input { flex: 1; padding: 8px 12px; border: 1px solid #444; border-radius: 6px; background: #262626; color: #e0e0e0; font-size: 14px; }
#chat-input::placeholder { color: #666; }
#send-btn { padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
#send-btn:hover { background: #2563eb; }

#status-text { font-size: 12px; color: #666; }
</style>
</head>
<body>

<div id="input-section">
  <input id="url-input" type="text" placeholder="Paste video URL (YouTube / Bilibili / Twitter / Vimeo...) or upload local file">
  <label id="file-label" for="file-input">Choose File</label>
  <input id="file-input" type="file" accept="video/*">
  <button id="load-btn">Load Video</button>
  <details id="adv-toggle" style="position:relative">
    <summary style="font-size:12px;color:#888;cursor:pointer;white-space:nowrap">Options</summary>
    <div id="adv-panel">
      <input id="cookies-input" type="text" placeholder="cookies.txt path (optional)">
      <input id="extraargs-input" type="text" placeholder="extra yt-dlp args (optional)">
    </div>
  </details>
</div>

<div id="progress-area">
  <span id="status-text"></span>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="main-content">
  <div id="video-area">
    <video id="video-player" controls>
      <source id="video-source" src="">
    </video>
  </div>
  <div id="chapter-area" style="display:none">
    <h3>章节</h3>
    <div id="chapter-list"></div>
    <div id="chapter-empty" style="display:none">暂无章节（转写完成后自动生成）</div>
  </div>
  <div id="chat-area">
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask about the video..." disabled>
      <label style="font-size:12px;color:#888;display:flex;align-items:center;gap:2px;white-space:nowrap;cursor:pointer">
        <input id="agentic-toggle" type="checkbox" style="cursor:pointer"> Agent
      </label>
      <button id="send-btn" onclick="sendQuestion()">Send</button>
    </div>
  </div>
</div>

<script>
let videoId = null;
let conversationId = null;
let renderedConversationId = null;
let ws = null;
let reconnectTimer = null;

document.getElementById('load-btn').addEventListener('click', loadVideo);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendQuestion();
});

const params = new URLSearchParams(location.search);
const presetVideo = params.get('video');
if (presetVideo) {
  loadExistingVideo(presetVideo);
}

let chapters = [];

async function loadExistingVideo(vid) {
  videoId = vid;
  document.getElementById('main-content').style.display = 'flex';
  document.getElementById('chat-input').disabled = false;
  document.getElementById('input-section').querySelector('#load-btn').textContent = 'Loaded';
  document.getElementById('load-btn').disabled = true;
  document.getElementById('url-input').value = '';

  try {
    const info = await fetch(`/api/videos/${vid}`).then((r) => {
      if (!r.ok) throw new Error('video not found: ' + vid);
      return r.json();
    });
    const path = `/api/videos/${vid}/file`;
    const src = document.getElementById('video-source');
    src.src = path;
    src.type = path.toLowerCase().endsWith('.m4a') ? 'audio/mp4' : 'video/mp4';
    document.getElementById('video-player').load();

    fetchChapters(vid);
    connectWebSocket(vid);
    loadLatestConversation(vid);
  } catch (err) {
    alert('Error: ' + err.message);
    document.getElementById('load-btn').disabled = false;
    document.getElementById('load-btn').textContent = 'Load Video';
  }
}

async function fetchChapters(vid) {
  try {
    const data = await fetch(`/api/videos/${vid}/chapters`).then((r) => r.json());
    chapters = data.chapters || [];
    renderChapters();
  } catch (e) {
  }
}

function renderChapters() {
  const list = document.getElementById('chapter-list');
  const empty = document.getElementById('chapter-empty');
  list.innerHTML = '';
  if (!chapters.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  document.getElementById('chapter-area').style.display = 'flex';
  chapters.forEach((c, i) => {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    item.dataset.index = i;
    const title = document.createElement('div');
    title.className = 'chapter-title';
    title.textContent = `${i + 1}. ${c.title}`;
    const time = document.createElement('div');
    time.className = 'chapter-time';
    time.textContent = `${formatTime(c.start_time)} – ${formatTime(c.end_time)}`;
    item.appendChild(title);
    item.appendChild(time);
    if (c.summary) {
      const summary = document.createElement('div');
      summary.className = 'chapter-summary';
      summary.textContent = c.summary;
      item.appendChild(summary);
    }
    item.addEventListener('click', () => {
      const player = document.getElementById('video-player');
      player.currentTime = c.start_time;
      player.play();
    });
    list.appendChild(item);
  });
}

function highlightCurrentChapter(time) {
  const items = document.querySelectorAll('.chapter-item');
  let idx = -1;
  for (let i = 0; i < chapters.length; i++) {
    const c = chapters[i];
    if (time >= c.start_time && (i === chapters.length - 1 || time < chapters[i + 1].start_time)) {
      idx = i;
      break;
    }
  }
  items.forEach((el, i) => el.classList.toggle('active', i === idx));
}

document.getElementById('video-player').addEventListener('timeupdate', () => {
  highlightCurrentChapter(document.getElementById('video-player').currentTime);
});

async function loadVideo() {
  const url = document.getElementById('url-input').value.trim();
  const fileInput = document.getElementById('file-input');
  const file = fileInput.files[0];

  if (!url && !file) { alert('Please paste a YouTube URL or select a local file.'); return; }

  document.getElementById('load-btn').disabled = true;
  document.getElementById('load-btn').textContent = 'Loading...';
  document.getElementById('chat-messages').innerHTML = '';
  conversationId = null;
  renderedConversationId = null;

  const formData = new FormData();
  if (url) formData.append('url', url);
  if (file) formData.append('file', file);
  const cookies = document.getElementById('cookies-input').value.trim();
  const extraArgs = document.getElementById('extraargs-input').value.trim();
  if (cookies) formData.append('cookies_path', cookies);
  if (extraArgs) formData.append('extra_args', extraArgs);

  try {
    const resp = await fetch('/api/videos', { method: 'POST', body: formData });
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Failed'); }
    const data = await resp.json();
    videoId = data.video_id;

    document.getElementById('main-content').style.display = 'flex';
    document.getElementById('progress-area').style.display = 'block';
    document.getElementById('chat-input').disabled = false;

    connectWebSocket(videoId);
    loadLatestConversation(videoId);
    waitForFileReady(videoId);
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    document.getElementById('load-btn').disabled = false;
    document.getElementById('load-btn').textContent = 'Load Video';
  }
}

async function waitForFileReady(vid) {
  for (let i = 0; i < 600; i++) {
    let info;
    try {
      info = await fetch(`/api/videos/${vid}`).then((r) => r.json());
    } catch (e) {
      await new Promise((r) => setTimeout(r, 1000));
      continue;
    }
    if (info.status === 'error') break;
    if (info.file_ready) {
      const path = `/api/videos/${vid}/file`;
      const src = document.getElementById('video-source');
      src.src = path;
      src.type = path.toLowerCase().endsWith('.m4a') ? 'audio/mp4' : 'video/mp4';
      document.getElementById('video-player').load();
      return;
    }
    await new Promise((r) => setTimeout(r, 1000));
  }
}

function connectWebSocket(vid) {
  if (ws) { ws.close(); }
  if (reconnectTimer) { clearTimeout(reconnectTimer); }

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws/${vid}`);

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'progress') {
        updateProgress(msg);
      } else if (msg.type === 'conversation') {
        conversationId = msg.conversation_id;
      } else if (msg.type === 'qa_chunk') {
        appendToCurrentAnswer(msg.text);
      } else if (msg.type === 'qa_done') {
        finalizeAnswer();
      } else if (msg.type === 'qa_warning') {
        dropPlaceholder();
        addChatBubble('warning', msg.message);
      } else if (msg.type === 'tool_call') {
        const argStr = typeof msg.args === 'object' ? JSON.stringify(msg.args) : msg.args;
        addChatBubble('info', `🔍 ${msg.tool}(${argStr})`);
      }
    } catch (e) {
    }
  };

  ws.onclose = () => {
    reconnectTimer = setTimeout(() => {
      if (videoId) connectWebSocket(videoId);
    }, 3000);
  };

  ws.onerror = () => { ws.close(); };
}

function updateProgress(msg) {
  const fill = document.getElementById('progress-fill');
  const status = document.getElementById('status-text');
  const total = msg.total || 1;
  const pct = Math.min(100, Math.round((msg.processed_up_to / total) * 100));
  fill.style.width = pct + '%';

  const stageNames = {
    starting: 'Starting...',
    downloading: 'Downloading audio...',
    audio_fallback: 'Audio stream blocked, extracting from video...',
    audio_extraction: 'Extracting audio...',
    transcription: `Transcribing... covered ${formatTime(msg.processed_up_to)} / ${formatTime(msg.total)} — you can ask now`,
    keyframe_extraction: 'Extracting keyframes...',
    complete: 'Preprocessing complete',
    error: 'Error: ' + (msg.message || 'Unknown error'),
  };
  status.textContent = stageNames[msg.stage] || msg.stage;
}

let currentAnswerEl = null;
let currentAnswerRaw = '';

document.getElementById('chat-messages').addEventListener('click', (e) => {
  const cite = e.target.closest('.cite');
  if (!cite) return;
  const sec = parseFloat(cite.dataset.time);
  if (!isNaN(sec)) {
    const player = document.getElementById('video-player');
    if (player) player.currentTime = sec;
  }
});

function sendQuestion() {
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question || !ws || ws.readyState !== WebSocket.OPEN) return;

  const position = document.getElementById('video-player').currentTime;
  addChatBubble('user', question);
  currentAnswerRaw = '';
  currentAnswerEl = addChatBubble('assistant thinking', '思考中');

  ws.send(JSON.stringify({ type: 'qa_request', question, position, conversation_id: conversationId, agentic: document.getElementById('agentic-toggle').checked }));
  input.value = '';
}

function isPlaceholder() {
  return !!currentAnswerEl && currentAnswerEl.classList.contains('thinking');
}

function dropPlaceholder() {
  if (isPlaceholder()) {
    currentAnswerEl.remove();
    currentAnswerEl = null;
    currentAnswerRaw = '';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAnswerWithCitations(raw) {
  const re = /\[(\d{1,2}):(\d{1,2})\]/g;
  let html = '';
  let last = 0;
  let m;
  while ((m = re.exec(raw))) {
    html += escapeHtml(raw.slice(last, m.index));
    const seconds = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    html += `<span class="cite" data-time="${seconds}" title="跳转到 ${m[0]}">${m[0]}</span>`;
    last = m.index + m[0].length;
  }
  html += escapeHtml(raw.slice(last));
  return html;
}

function appendToCurrentAnswer(text) {
  if (!currentAnswerEl) {
    currentAnswerEl = addChatBubble('assistant', '');
  }
  if (isPlaceholder()) {
    currentAnswerEl.classList.remove('thinking');
    currentAnswerEl.textContent = '';
  }
  currentAnswerRaw += text;
  currentAnswerEl.textContent += text;
  document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
}

function finalizeAnswer() {
  if (currentAnswerEl) {
    if (currentAnswerRaw) {
      currentAnswerEl.classList.remove('thinking');
      currentAnswerEl.innerHTML = renderAnswerWithCitations(currentAnswerRaw);
    } else {
      currentAnswerEl.classList.remove('thinking');
      currentAnswerEl.classList.add('warning');
      currentAnswerEl.textContent = '模型没有返回内容。可能是推理占满了 token 预算，或上游断流——可以重试或换个问法。';
    }
    document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
  }
  currentAnswerEl = null;
  currentAnswerRaw = '';
}

function addChatBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + role;
  div.textContent = text;
  document.getElementById('chat-messages').appendChild(div);
  document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
  return div;
}

function renderChatHistory(convId, messages) {
  if (renderedConversationId === convId) return;
  renderedConversationId = convId;
  document.getElementById('chat-messages').innerHTML = '';
  if (!messages || !messages.length) return;
  for (const m of messages) {
    const el = addChatBubble(m.role === 'user' ? 'user' : 'assistant', m.content || '');
    if (m.role !== 'user') el.innerHTML = renderAnswerWithCitations(m.content || '');
  }
}

async function loadLatestConversation(vid) {
  try {
    const list = await fetch(`/api/videos/${vid}/conversations`).then((r) => r.json());
    const latest = (list.conversations || [])[0];
    if (!latest) return;
    const detail = await fetch(`/api/videos/${vid}/conversations/${latest.id}`).then((r) => r.json());
    conversationId = detail.id;
    renderChatHistory(detail.id, detail.messages);
  } catch (e) { /* 后端未就绪时静默 */ }
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + String(s).padStart(2, '0');
}

</script>

</body>
</html>
